services:
  backend:
    environment:
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS site origin}
      DEMO_MODE: "false"

  frontend:
    ports:
      - "${SITE_BIND_IP:-192.168.174.137}:443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro